<div class="change-password-container p-4">
    <form [formGroup]="form" class="change-password-form">
        
        <!-- Current Password -->
        <app-input-field class="mb-3"
            [label]="'Current Password'|translateToArabic:languageFactor"
            [languageFactor]="languageFactor"
            [icon]="'pi pi-lock'"
            [isRequired]="hasRequiredValidator(form, 'currentPassword')"
            [isValid]="form.get('currentPassword')?.valid">
            <p-password 
                formControlName="currentPassword" 
                [toggleMask]="true"
                [feedback]="false"
                styleClass="w-full"
                inputStyleClass="w-full">
            </p-password>
        </app-input-field>

        <!-- New Password -->
        <app-input-field class="mb-3"
            [label]="'New Password'|translateToArabic:languageFactor"
            [languageFactor]="languageFactor"
            [icon]="'pi pi-key'"
            [isRequired]="hasRequiredValidator(form, 'newPassword')"
            [isValid]="form.get('newPassword')?.valid">
            <p-password 
                formControlName="newPassword" 
                [toggleMask]="true"
                [feedback]="true"
                styleClass="w-full"
                inputStyleClass="w-full">
            </p-password>
        </app-input-field>

        <!-- Password Confirmation -->
        <app-input-field class="mb-3"
            [label]="'Password Confirmation'|translateToArabic:languageFactor"
            [languageFactor]="languageFactor"
            [icon]="'pi pi-check-circle'"
            [isRequired]="hasRequiredValidator(form, 'PasswordConfirmation')"
            [isValid]="form.get('PasswordConfirmation')?.valid && !form.hasError('passwordsNotMatch')">
            <p-password 
                formControlName="PasswordConfirmation" 
                [toggleMask]="true"
                [feedback]="false"
                styleClass="w-full"
                inputStyleClass="w-full">
            </p-password>
            <small *ngIf="form.hasError('passwordsNotMatch') && f['PasswordConfirmation'].touched" class="p-error block mt-1">
                {{'Passwords do not match'|translateToArabic:languageFactor}}
            </small>
        </app-input-field>
        
    </form>
    
    <!-- Action Buttons -->
    <div class="flex justify-content-end gap-2 mt-4">
        <p-button 
            label="{{'Cancel'|translateToArabic:languageFactor}}" 
            severity="secondary" 
            [outlined]="true"
            (click)="onCancel()">
        </p-button>
        <p-button 
            [disabled]="form.invalid" 
            label="{{'Save'|translateToArabic:languageFactor}}" 
            icon="pi pi-check"
            (click)="submit()">
        </p-button>
    </div>
</div>

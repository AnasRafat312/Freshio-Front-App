<mat-card class="container">
    <mat-card-header>
        <mat-card-title><i class="fas fa-plus-circle fa-xl"></i>&nbsp; Forget Password</mat-card-title>
    </mat-card-header>
    <br>
    <mat-card-content>
        <form [formGroup]="form" class="example-form">
            <mat-form-field appearance="outline" class="example-full-width small-form-field">
                <mat-label>Email</mat-label>
                <input type="email" matInput formControlName="email" placeholder="Ex. name@example.com" required>
                <mat-error *ngIf="f['email'].errors && f['email'].errors['required']">
                    <strong>required</strong>
                </mat-error>
                <mat-error *ngIf="f['email'].errors && f['email'].errors['email']">
                   <strong>Email is invalid</strong>
                </mat-error>
                <mat-error *ngIf="f['email'].errors && f['email'].errors['emailExists']">
                    <strong>Email address is already exsits</strong>
                 </mat-error>
            </mat-form-field>
        </form>
    </mat-card-content>
     <mat-card-actions>
        <button mat-raised-button color="primary" [disabled]="form.invalid" type="submit" (click)="submit()">Save</button>
        <button mat-raised-button color="warn" (click)="onCancel()">Cancel</button>
    </mat-card-actions>
</mat-card>

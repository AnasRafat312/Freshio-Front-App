<div class="bank-account-details-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <p-skeleton height="200px"></p-skeleton>
    <p-skeleton height="150px" class="mt-3"></p-skeleton>
  </div>

  <!-- Details Content -->
  <div *ngIf="!loading && bankAccountDetails" class="details-content">
    
    <!-- Basic Information Card -->
    <app-detail-card 
      [title]="getLabel('Bank Account Information', 'معلومات الحساب البنكي')"
      icon="pi pi-building"
      [columns]="0"
      [collapsible]="true">
      
      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-user"
        [label]="getLabel('Account Holder Name', 'اسم صاحب الحساب')"
        [value]="bankAccountDetails.AccountHolderName">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-building"
        [label]="getLabel('Bank Name', 'اسم البنك')"
        [value]="bankAccountDetails.BankName">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-hashtag"
        [label]="getLabel('Account Number', 'رقم الحساب')"
        [value]="bankAccountDetails.AccountNumber">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-credit-card"
        [label]="getLabel('IBAN', 'الآيبان')"
        [value]="bankAccountDetails.IBAN || getLabel('N/A', 'غير متوفر')">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-phone"
        [label]="getLabel('Phone Number', 'رقم الهاتف')"
        [value]="bankAccountDetails.PhoneNumber || getLabel('N/A', 'غير متوفر')">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-wallet"
        [label]="getLabel('Balance', 'الرصيد')"
        [value]="bankAccountDetails.Balance"
        valueType="amount"
        currencySymbol="$"
        [minFractionDigits]="2"
        [maxFractionDigits]="2">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-calendar"
        [label]="getLabel('Created At', 'تاريخ الإنشاء')"
        [value]="bankAccountDetails.CreatedAt"
        valueType="date">
      </app-detail-item>
    </app-detail-card>

    <!-- Money Sent To Card -->
    <app-detail-card 
      *ngIf="moneySentToList.length > 0"
      [title]="getLabel('Money Sent To', 'الأموال المرسلة إلى')"
      icon="pi pi-arrow-up-right"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneySentToList" 
          [filteredList]="moneySentToFiltered" 
          [model]="moneySentToModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Money Received From Card -->
    <app-detail-card 
      *ngIf="moneyReceivedFromList.length > 0"
      [title]="getLabel('Money Received From', 'الأموال المستلمة من')"
      icon="pi pi-arrow-down-left"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneyReceivedFromList" 
          [filteredList]="moneyReceivedFromFiltered" 
          [model]="moneyReceivedFromModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Empty State for Transactions -->
    <div *ngIf="moneySentToList.length === 0 && moneyReceivedFromList.length === 0"
         class="empty-state mt-3">
      <i class="pi pi-inbox" style="font-size: 3rem; color: #ccc;"></i>
      <p>{{ getLabel('No transactions found', 'لا توجد معاملات') }}</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading && !bankAccountDetails && error" class="error-state">
    <i class="pi pi-exclamation-triangle" style="font-size: 3rem; color: #f44336;"></i>
    <p>{{ getLabel('Failed to load bank account details', 'فشل تحميل تفاصيل الحساب البنكي') }}</p>
    <button pButton 
            type="button" 
            [label]="getLabel('Retry', 'إعادة المحاولة')" 
            icon="pi pi-refresh" 
            class="p-button-outlined p-button-secondary mt-3"
            (click)="retry()">
    </button>
  </div>
</div>

<div class="details-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <p-progressSpinner></p-progressSpinner>
    <p>{{ languageFactor === 'en' ? 'Loading fawry machine details...' : 'جاري تحميل تفاصيل ماكينة فوري...' }}</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-state">
    <i class="pi pi-exclamation-triangle"></i>
    <p>{{ languageFactor === 'en' ? 'Failed to load fawry machine details' : 'فشل تحميل تفاصيل ماكينة فوري' }}</p>
    <button pButton (click)="close()" label="{{ languageFactor === 'en' ? 'Close' : 'إغلاق' }}"></button>
  </div>

  <!-- Details Content -->
  <div *ngIf="!loading && !error && fawryMachineDetails" class="details-content">
    <!-- Main Fawry Machine Information Card -->
    <app-detail-card 
      [title]="getLabel('Fawry Machine Information', 'معلومات ماكينة فوري')"
      icon="pi pi-desktop"
      [columns]="0"
      [collapsible]="true">
      
      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-hashtag"
        [label]="getLabel('Serial Number', 'الرقم التسلسلي')"
        [value]="fawryMachineDetails.SerialNumber">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-phone"
        [label]="getLabel('Phone Number', 'رقم الهاتف')"
        [value]="fawryMachineDetails.PhoneNumber">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-info-circle"
        [label]="getLabel('Status', 'الحالة')"
        [value]="fawryMachineDetails.Status === 1 ? getLabel('Available', 'متاح') : getLabel('Unavailable', 'غير متاح')">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-wallet"
        [label]="getLabel('Balance', 'الرصيد')"
        [value]="fawryMachineDetails.Balance"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-chart-line"
        [label]="getLabel('Daily Used', 'الإستخدام اليومي')"
        [value]="fawryMachineDetails.DailyUsed || 0"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-chart-bar"
        [label]="getLabel('Monthly Used', 'الإستخدام الشهري')"
        [value]="fawryMachineDetails.MonthlyUsed || 0"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        *ngIf="fawryMachineDetails.Notes"
        customClass="col-12"
        icon="pi pi-file-edit"
        [label]="getLabel('Notes', 'ملاحظات')"
        [value]="fawryMachineDetails.Notes">
      </app-detail-item>
    </app-detail-card>

    <!-- Money Sent To Card -->
    <app-detail-card 
      *ngIf="moneySentToList.length > 0"
      [title]="getLabel('Money Sent To', 'الأموال المرسلة إلى')"
      icon="pi pi-arrow-up-right"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneySentToList" 
          [filteredList]="moneySentToFiltered" 
          [model]="moneySentToModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Money Received From Card -->
    <app-detail-card 
      *ngIf="moneyReceivedFromList.length > 0"
      [title]="getLabel('Money Received From', 'الأموال المستلمة من')"
      icon="pi pi-arrow-down-left"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneyReceivedFromList" 
          [filteredList]="moneyReceivedFromFiltered" 
          [model]="moneyReceivedFromModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Empty State for Transactions -->
    <div *ngIf="moneySentToList.length === 0 && moneyReceivedFromList.length === 0"
         class="empty-state mt-3">
      <i class="pi pi-inbox" style="font-size: 3rem; color: #ccc;"></i>
      <p>{{ getLabel('No transactions found', 'لا توجد معاملات') }}</p>
    </div>
  </div>
</div>

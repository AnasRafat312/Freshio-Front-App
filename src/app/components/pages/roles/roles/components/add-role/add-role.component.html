<mat-card class="container">
    <mat-card-header [ngClass]="{'rtl': languageFactor === 'ar'}">
        <mat-card-title *ngIf="!data?.rowData"><i class="fas fa-plus-circle fa-xl"></i>&nbsp; {{'Add Role'|translateToArabic:languageFactor}}</mat-card-title>
        <mat-card-title *ngIf="data?.rowData"><i class="fas fa-edit fa-xl"></i>&nbsp;{{'Edit Role'|translateToArabic:languageFactor}}</mat-card-title>
    </mat-card-header>
    <br>
    <mat-card-content>
        <form [formGroup]="form" class="row">
            <div class="mb-3 col-12">
                <app-input-field
                    [label]="'Role name' | translateToArabic: languageFactor"
                    [isRequired]="hasRequiredValidator('name')"
                    [isValid]="form.get('name')?.valid"
                    [icon]="'pi pi-shield'">
                    <input 
                        type="text" 
                        pInputText 
                        formControlName="name"
                        [ngClass]="{'ng-invalid ng-dirty': form.get('name')?.invalid && form.get('name')?.touched}" />
                </app-input-field>
            </div>
        </form>
    </mat-card-content>
     <mat-card-actions>
        <button mat-raised-button color="primary" [disabled]="form.invalid" type="submit" (click)="submit()">{{'Save'|translateToArabic:languageFactor}}</button>
        <button mat-raised-button color="warn" (click)="onCancel()">{{'Cancel'|translateToArabic:languageFactor}}</button>
    </mat-card-actions>
</mat-card>

<mat-card>
    <mat-card-header>
        <mat-card-title><i class="fas fa-paperclip fa-xl"></i>&nbsp; {{'Add Attachments'|translateToArabic:languageFactor}}</mat-card-title>
    </mat-card-header>
    <br>
    <mat-card-content>
      <div class="d-flex align-items-center justify-content-center w-100" (drop)="onFileDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)">
        <label for="file" class="w-100">
          <div class="upload-container">
            <div class="upload-label">
              <img class="upload-img" src="../../../../../../assets/images/upload.svg" alt="" width="30" height="30">
              <input #files type="file" id="file" class="upload-input" name="files" (change)="onFileSelected($event)" multiple>
              <div *ngIf="languageFactor == 'en'"> Drop file here or <span class="text-primary">select from your computer</span></div>
              <div *ngIf="languageFactor == 'ar'"><span class="text-primary">أختر من جهازك</span> أدرج ملف هنا أو </div>
            </div>
            <img class="files-img" src="../../../../../../assets/images/files.svg" alt="" width="50" height="50">
          </div>
        </label>
      </div>
      <div class="table-responsive">
        <table class="table table-striped table-hover" *ngIf="selectedFileInUpdate != null && selectedFileInUpdate.length > 0" class="table">
            <thead class="table-dark">
              <tr>
                <th>{{'File Name'|translateToArabic:languageFactor}}</th>
                <th>{{'File Size'|translateToArabic:languageFactor}}</th>
                <th colspan="2">{{'Action'|translateToArabic:languageFactor}}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let file of selectedFileInUpdate" >
                <td>{{ file?.fileDocument?.name }}</td>
                <td>{{ formatFileSize(file?.fileDocument?.fileSize) }}</td>
                <td style="width: 55px;">
                    <button  [disabled]="file?.fileDocument?.CreatedBy && file?.fileDocument?.CreatedBy != CreatedBy" type="button" class="btn btn-danger" (click)="removeFile(file)">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
                <td style="width: 55px;">
                    <a [href]="urlBase+file?.fileDocument?.url" download="{{ file.fileDocument?.name }}" target="_blank">
                        <button type="button" class="btn btn-primary">
                            <i class="fa-solid fa-file-arrow-down"></i>
                        </button>
                    </a>
                </td>
              </tr>
            </tbody>
          </table>
      </div>
    </mat-card-content>
     <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" (click)="submit()">{{'Add'|translateToArabic:languageFactor}}</button>
        <button mat-raised-button color="warn" (click)="onCancel()">{{'Cancel'|translateToArabic:languageFactor}}</button>
    </mat-card-actions>
  </mat-card>

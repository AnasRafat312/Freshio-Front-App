<div class="details-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <p-progressSpinner></p-progressSpinner>
    <p>{{ getLabel('Loading wallet details...', 'جاري تحميل تفاصيل المحفظة...') }}</p>
  </div>

  <!-- Content State -->
  <div *ngIf="!loading && !error && walletDetails" class="details-content">
    <!-- Main Wallet Information Card -->
    <app-detail-card 
      [title]="getLabel('Wallet Information', 'معلومات المحفظة')"
      icon="pi pi-wallet"
      [columns]="0"
      [collapsible]="true">
      
      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-user"
        [label]="getLabel('Name', 'الاسم')"
        [value]="walletDetails.Name">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-phone"
        [label]="getLabel('Phone Number', 'رقم الهاتف')"
        [value]="walletDetails.PhoneNumber">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-id-card"
        [label]="getLabel('National ID', 'الرقم القومي')"
        [value]="walletDetails.NationalId">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-wallet"
        [label]="getLabel('Balance', 'الرصيد')"
        [value]="walletDetails.Balance"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-chart-line"
        [label]="getLabel('Daily Limit', 'الحد اليومي')"
        [value]="walletDetails.DailyLimit"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-chart-bar"
        [label]="getLabel('Monthly Limit', 'الحد الشهري')"
        [value]="walletDetails.MonthlyLimit"
        valueType="amount"
        currencySymbol="$">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-building"
        [label]="getLabel('Provider', 'المزود')"
        [value]="walletDetails.Provider">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-info-circle"
        [label]="getLabel('Status', 'الحالة')"
        [value]="walletDetails.Status">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-calendar"
        [label]="getLabel('Created At', 'تاريخ الإنشاء')"
        [value]="walletDetails.CreatedAt"
        valueType="date">
      </app-detail-item>
    </app-detail-card>

    <!-- Money Sent To Card -->
    <app-detail-card 
      *ngIf="moneySentToList.length > 0"
      [title]="getLabel('Money Sent To', 'الأموال المرسلة إلى')"
      icon="pi pi-arrow-up-right"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneySentToList" 
          [filteredList]="moneySentToFiltered" 
          [model]="moneySentToModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Money Received From Card -->
    <app-detail-card 
      *ngIf="moneyReceivedFromList.length > 0"
      [title]="getLabel('Money Received From', 'الأموال المستلمة من')"
      icon="pi pi-arrow-down-left"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneyReceivedFromList" 
          [filteredList]="moneyReceivedFromFiltered" 
          [model]="moneyReceivedFromModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Empty State for Transactions -->
    <div *ngIf="moneySentToList.length === 0 && moneyReceivedFromList.length === 0"
         class="empty-state mt-3">
      <i class="pi pi-inbox" style="font-size: 3rem; color: #ccc;"></i>
      <p>{{ getLabel('No transactions found', 'لا توجد معاملات') }}</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading && !walletDetails && error" class="error-state">
    <i class="pi pi-exclamation-triangle" style="font-size: 3rem; color: #f44336;"></i>
    <p>{{ getLabel('Failed to load wallet details', 'فشل تحميل تفاصيل المحفظة') }}</p>
    <button pButton type="button" [label]="getLabel('Retry', 'إعادة المحاولة')" icon="pi pi-refresh" (click)="retry()"></button>
  </div>
</div>

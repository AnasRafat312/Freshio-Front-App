<div class="details-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <p-progressSpinner></p-progressSpinner>
    <p>{{ getLabel('Loading trader details...', 'جاري تحميل تفاصيل التاجر...') }}</p>
  </div>

  <!-- Content State -->
  <div *ngIf="!loading && !error && traderDetails" class="details-content">
    <!-- Main Trader Information Card -->
    <app-detail-card 
      [title]="getLabel('Trader Information', 'معلومات التاجر')"
      icon="pi pi-user"
      [columns]="0"
      [collapsible]="true">
      
      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-user"
        [label]="getLabel('Name', 'الاسم')"
        [value]="traderDetails.Name">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-phone"
        [label]="getLabel('Phone Number', 'رقم الهاتف')"
        [value]="traderDetails.PhoneNumber">
      </app-detail-item>

      <app-detail-item 
        customClass="col-sm-12 col-md-6 col-lg-4"
        icon="pi pi-id-card"
        [label]="getLabel('National ID', 'الرقم القومي')"
        [value]="traderDetails.NationalID">
      </app-detail-item>
    </app-detail-card>

    <!-- Money Sent By Date Card -->
    <app-detail-card 
      *ngIf="moneySentList.length > 0"
      [title]="getLabel('Money Sent By Date', 'الأموال المرسلة حسب التاريخ')"
      icon="pi pi-arrow-up-right"
      [columns]="0"
      [collapsible]="true"
      class="mt-3">
      
      <div class="col-12">
        <app-basic-table 
          [mainList]="moneySentList" 
          [filteredList]="moneySentFiltered" 
          [model]="moneySentModel">
        </app-basic-table>
      </div>
    </app-detail-card>

    <!-- Empty State for Transactions -->
    <div *ngIf="moneySentList.length === 0"
         class="empty-state mt-3">
      <i class="pi pi-inbox" style="font-size: 3rem; color: #ccc;"></i>
      <p>{{ getLabel('No transactions found', 'لا توجد معاملات') }}</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading && !traderDetails && error" class="error-state">
    <i class="pi pi-exclamation-triangle" style="font-size: 3rem; color: #f44336;"></i>
    <p>{{ getLabel('Failed to load trader details', 'فشل تحميل تفاصيل التاجر') }}</p>
    <button pButton type="button" [label]="getLabel('Retry', 'إعادة المحاولة')" icon="pi pi-refresh" (click)="retry()"></button>
  </div>
</div>

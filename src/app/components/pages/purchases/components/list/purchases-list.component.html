<div class="page-container">
  <!-- Header -->
  <div class="page-header">
    <div class="page-title-wrapper">
      <div class="page-icon icon-purchases">
        <i class="pi pi-shopping-cart"></i>
      </div>
      <h2 class="page-title">{{'Purchases'|translateToArabic:languageFactor}}</h2>
    </div>
    <button *ngIf="Add" pButton type="button" [label]="'Add'|translateToArabic:languageFactor" icon="pi pi-plus" class="p-button-success" (click)="addEdit()"></button>
  </div>

  <!-- Body -->
  <div class="page-body">
    <app-basic-table 
      [mainList]="mainList" 
      [filteredList]="filteredList" 
      [model]="model" 
      [ActionsList]="actionsList"
      (OnFiltereList)="calculateTotalAmount()"
      [hasFooter]="true">
      <ng-container class="footer">
        <tr>
          <td colspan="4"></td>
          <td>{{totalAmount}}</td>
          <td colspan="3"></td>
        </tr>
      </ng-container>
    </app-basic-table>
  </div>
</div>
